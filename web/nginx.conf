# Configuração de produção do Nginx (usada pelo build Docker da aplicação).
# Serve o bundle estático do frontend e faz proxy de /api para o serviço da API.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # API -> serviço backend `api` na porta 8000 (rede Docker interna)
    location /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Assets com hash no nome do arquivo: cache longo e imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML sempre revalidado (é ele que referencia os assets com hash)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: rotas (ex.: #/admin são client-side, mas garantimos index.html)
    location / {
        try_files $uri /index.html;
    }
}
